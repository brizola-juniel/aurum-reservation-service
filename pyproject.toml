[project]
name = "aurum-reservation-service"
version = "1.0.1"
description = "FastAPI reservation microservice for Aurum Reservas Brasil meeting rooms."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.17.2",
    "aiosqlite==0.22.1",
    "asyncpg==0.31.0",
    "fastapi==0.136.1",
    "pydantic-settings==2.14.1",
    "pyjwt==2.12.1",
    "sqlalchemy==2.0.49",
    "uvicorn[standard]==0.46.0"
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==2.1.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.14"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = []
strict = true
warn_unused_ignores = true
exclude = ["tests"]

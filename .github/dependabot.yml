version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-api:
        patterns:
          - fastapi
          - pydantic*
          - sqlalchemy
          - alembic
          - asyncpg
          - uvicorn*
          - pyjwt
      python-dev:
        patterns:
          - pytest*
          - ruff
          - mypy
          - httpx

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
